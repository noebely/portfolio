<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noé Bély — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS officielle PDF.js pour la TextLayer -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf_viewer.min.css"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    /* =========================
       GALERIE
       ========================= */

    .gallery {
      display: flex;
      width: 100%;
      height: 100dvh;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }


    /* =========================
       SLIDES
       ========================= */

    .slide {
      position: relative;

      flex: 0 0 100vw;
      width: 100vw;
      min-width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      scroll-snap-align: start;
    }


    /* =========================
       CONTENEUR PDF
       ========================= */

    .pdf-container {
      position: relative;

      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #000;
    }


    /* =========================
       PAGE PDF
       ========================= */

    .pdf-page {
      position: relative;

      flex: 0 0 auto;

      overflow: hidden;

      background: #fff;

      line-height: 0;
    }


    /* =========================
       CANVAS
       ========================= */

    .pdf-page canvas {
      display: block;

      margin: 0;
      padding: 0;

      max-width: none;
      max-height: none;
    }


    /* =========================
       TEXT LAYER
       ========================= */

    .textLayer {
      position: absolute;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;

      overflow: hidden;

      text-align: initial;

      forced-color-adjust: none;

      z-index: 2;

      pointer-events: auto;

      --total-scale-factor: 1;
    }


    /* =========================
       ANNOTATION / LIENS PDF
       ========================= */

    .annotationLayer {
      position: absolute;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;

      z-index: 3;

      pointer-events: none;
    }

    .annotationLayer a {
      position: absolute;

      display: block;

      pointer-events: auto;

      cursor: pointer;

      text-decoration: none;
    }


    /* =========================
       FLÈCHES
       ========================= */

    .arrow {
      position: fixed;

      top: 50%;
      transform: translateY(-50%);

      z-index: 100;

      width: 90px;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;

      color: rgba(255, 255, 255, 0.75);

      font-size: 70px;
      font-family: Arial, sans-serif;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }

    .arrow:hover {
      color: rgba(255, 255, 255, 1);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .arrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>


<body>

  <!-- =========================
       GALERIE
       ========================= -->

  <div class="gallery" id="gallery">

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf1.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf2.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf3.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf4.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf5.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf6.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf7.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf8.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf9.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf10.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf11.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf12.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf13.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf14.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf15.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf16.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf17.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf18.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf19.pdf"></div>
    </div>

  </div>

  

  <!-- =========================
       FLÈCHES
       ========================= -->

  <button
    class="arrow arrow-left"
    id="left"
    aria-label="Image précédente">
    ‹
  </button>

  <button
    class="arrow arrow-right"
    id="right"
    aria-label="Image suivante">
    ›
  </button>


  <!-- =========================
       PDF.JS
       ========================= -->

  <script type="module">

    import {
      getDocument,
      GlobalWorkerOptions,
      TextLayer
    } from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";


    GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    /* =========================================
       CHARGEMENT D'UN PDF
       ========================================= */

    async function loadPDF(container) {

      const url = container.dataset.pdf;

      const pdf =
        await getDocument(url).promise;

      /*
        On utilise uniquement la première page,
        comme dans la version précédente.
      */

      const page =
        await pdf.getPage(1);


      /* =========================================
         CALCUL DU SCALE
         ========================================= */

      const baseViewport =
        page.getViewport({
          scale: 1
        });


      const availableWidth =
        window.innerWidth;

      const availableHeight =
        window.innerHeight;


      const scaleX =
        availableWidth /
        baseViewport.width;


      const scaleY =
        availableHeight /
        baseViewport.height;


      /*
        Le PDF tient entièrement dans l'écran.
      */

      const scale =
        Math.min(
          scaleX,
          scaleY
        );


      /*
        IMPORTANT :
        ce viewport est utilisé
        pour le canvas ET la TextLayer.
      */

      const viewport =
        page.getViewport({
          scale: scale
        });


      /* =========================================
         CONTENEUR DE PAGE
         ========================================= */

      const pageContainer =
        document.createElement("div");

      pageContainer.className =
        "pdf-page";


      pageContainer.style.width =
        viewport.width + "px";


      pageContainer.style.height =
        viewport.height + "px";


      /* =========================================
         CANVAS
         ========================================= */

      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      const outputScale =
        window.devicePixelRatio || 1;


      /*
        Résolution interne du canvas.
        Cela améliore la netteté sans modifier
        ses dimensions visuelles.
      */

      canvas.width =
        Math.floor(
          viewport.width *
          outputScale
        );


      canvas.height =
        Math.floor(
          viewport.height *
          outputScale
        );


      /*
        Dimensions CSS EXACTEMENT identiques
        au viewport PDF.
      */

      canvas.style.width =
        viewport.width + "px";


      canvas.style.height =
        viewport.height + "px";


      pageContainer.appendChild(
        canvas
      );


      /* =========================================
         TEXT LAYER
         ========================================= */

      const textLayerDiv =
        document.createElement("div");

      textLayerDiv.className =
        "textLayer";


      /*
        IMPORTANT POUR PDF.JS 5.x
      */

      textLayerDiv.style.setProperty(
        "--total-scale-factor",
        viewport.scale
      );


      pageContainer.appendChild(
        textLayerDiv
      );


      /* =========================================
         ANNOTATION LAYER
         ========================================= */

      const annotationLayer =
        document.createElement("div");

      annotationLayer.className =
        "annotationLayer";


      pageContainer.appendChild(
        annotationLayer
      );


      container.appendChild(
        pageContainer
      );


      /* =========================================
         RENDU DU CANVAS
         ========================================= */

      const transform =
        outputScale !== 1
          ? [
              outputScale,
              0,
              0,
              outputScale,
              0,
              0
            ]
          : null;


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport,

        transform:
          transform

      }).promise;


      /* =========================================
         RENDU DU TEXTE
         ========================================= */

      const textContent =
        await page.getTextContent();


      const textLayer =
        new TextLayer({

          textContentSource:
            textContent,

          container:
            textLayerDiv,

          viewport:
            viewport

        });


      await textLayer.render();


      /* =========================================
         LIENS PRÉSENTS DANS LE PDF
         ========================================= */

      const annotations =
        await page.getAnnotations();


      annotations.forEach(
        annotation => {

          if (
            annotation.subtype !==
            "Link"
          ) {
            return;
          }


          if (
            !annotation.rect
          ) {
            return;
          }


          /*
            Conversion des coordonnées PDF
            vers les coordonnées écran.
          */

          const rect =
            viewport.convertToViewportRectangle(
              annotation.rect
            );


          const left =
            Math.min(
              rect[0],
              rect[2]
            );


          const top =
            Math.min(
              rect[1],
              rect[3]
            );


          const width =
            Math.abs(
              rect[2] -
              rect[0]
            );


          const height =
            Math.abs(
              rect[3] -
              rect[1]
            );


          const link =
            document.createElement("a");


          link.style.left =
            left + "px";


          link.style.top =
            top + "px";


          link.style.width =
            width + "px";


          link.style.height =
            height + "px";


          /*
            Lien externe
          */

          if (
            annotation.url
          ) {

            link.href =
              annotation.url;

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

          }


          /*
            Destination interne au PDF.
          */

          else if (
            annotation.dest
          ) {

            link.href = "#";


            link.addEventListener(
              "click",
              async event => {

                event.preventDefault();

                try {

                  const destination =
                    await pdf.getDestination(
                      annotation.dest
                    );


                  if (
                    destination
                  ) {

                    const pageIndex =
                      await pdf.getPageIndex(
                        destination[0]
                      );


                    console.log(
                      "Lien vers page PDF :",
                      pageIndex + 1
                    );

                  }

                } catch (error) {

                  console.error(
                    "Erreur lien PDF :",
                    error
                  );

                }

              }
            );

          }


          annotationLayer.appendChild(
            link
          );

        }
      );

    }


    /* =========================================
       CHARGEMENT DES PDF
       ========================================= */

    const pdfContainers =
      document.querySelectorAll(
        ".pdf-container"
      );


    await Promise.all(

      Array.from(pdfContainers).map(
        async container => {

          try {

            await loadPDF(
              container
            );

          } catch (error) {

            console.error(
              "Erreur de chargement :",
              container.dataset.pdf,
              error
            );

          }

        }
      )

    );


    /* =========================================
       NAVIGATION
       ========================================= */

    const gallery =
      document.getElementById(
        "gallery"
      );


    const left =
      document.getElementById(
        "left"
      );


    const right =
      document.getElementById(
        "right"
      );


    const slides =
      document.querySelectorAll(
        ".slide"
      );


    const totalSlides =
      slides.length;


    /* =========================================
       SLIDE ACTUELLE
       ========================================= */

    function getCurrentSlide() {

      return Math.round(
        gallery.scrollLeft /
        gallery.clientWidth
      );

    }


    /* =========================================
       AFFICHAGE DES FLÈCHES
       ========================================= */

    function updateArrows() {

      const currentSlide =
        getCurrentSlide();


      left.classList.toggle(
        "hidden",
        currentSlide === 0
      );


      right.classList.toggle(
        "hidden",
        currentSlide ===
        totalSlides - 1
      );

    }


    /* =========================================
       SLIDE SUIVANTE
       ========================================= */

    function nextSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide <
        totalSlides - 1
      ) {

        gallery.scrollTo({

          left:
            (currentSlide + 1) *
            gallery.clientWidth,

          behavior:
            "smooth"

        });

      }

    }


    /* =========================================
       SLIDE PRÉCÉDENTE
       ========================================= */

    function previousSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide > 0
      ) {

        gallery.scrollTo({

          left:
            (currentSlide - 1) *
            gallery.clientWidth,

          behavior:
            "smooth"

        });

      }

    }


    /* =========================================
       CLIC SUR LES FLÈCHES
       ========================================= */

    right.addEventListener(
      "click",
      () => {

        nextSlide();

        right.blur();

      }
    );


    left.addEventListener(
      "click",
      () => {

        previousSlide();

        left.blur();

      }
    );


    /* =========================================
       CLAVIER
       ========================================= */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          nextSlide();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          previousSlide();

        }

      },
      true
    );


    /* =========================================
       SCROLL
       ========================================= */

    gallery.addEventListener(
      "scroll",
      updateArrows
    );


    updateArrows();

  </script>

</body>
</html>
