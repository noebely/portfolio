<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noé Bély — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* =========================
       GALERIE
       ========================= */

    .gallery {
      display: flex;

      width: 100%;
      height: 100dvh;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    /* =========================
       SLIDES
       ========================= */

    .slide {
      position: relative;

      flex: 0 0 100vw;
      width: 100vw;
      min-width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      scroll-snap-align: start;
    }

    /* =========================
       PDF
       ========================= */

    .pdf-container {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .pdf-page {
      position: relative;

      flex: 0 0 auto;

      overflow: hidden;
    }

    .pdf-page canvas {
      display: block;

      margin: 0;
      padding: 0;
    }

    /* =========================
       TEXT LAYER PDF.JS
       ========================= */

    .textLayer {
      position: absolute;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;

      overflow: hidden;

      line-height: 1;

      text-align: initial;

      forced-color-adjust: none;

      transform-origin: 0 0;

      z-index: 2;

      pointer-events: auto;
    }

    .textLayer span,
    .textLayer br {
      color: transparent;

      position: absolute;

      white-space: pre;

      cursor: text;

      transform-origin: 0% 0%;
    }

    .textLayer span::selection {
      background: rgba(0, 100, 255, 0.3);
    }

    /* =========================
       LIENS PDF
       ========================= */

    .annotationLayer {
      position: absolute;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;

      z-index: 3;

      pointer-events: none;
    }

    .annotationLayer a {
      position: absolute;

      display: block;

      pointer-events: auto;

      cursor: pointer;

      text-decoration: none;
    }

    /* =========================
       FLÈCHES
       ========================= */

    .arrow {
      position: fixed;

      top: 50%;
      transform: translateY(-50%);

      z-index: 100;

      width: 90px;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;

      color: rgba(255, 255, 255, 0.75);

      font-size: 70px;
      font-family: Arial, sans-serif;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }

    .arrow:hover {
      color: rgba(255, 255, 255, 1);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .arrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>


<body>

  <!-- =========================
       GALERIE
       ========================= -->

  <div class="gallery" id="gallery">

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf1.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf2.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf3.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf4.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf5.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf6.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf7.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf8.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf9.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf10.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf11.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf12.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf13.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf14.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf15.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf16.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf17.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf18.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf19.pdf"></div>
    </div>

  </div>


  <!-- =========================
       FLÈCHES
       ========================= -->

  <button
    class="arrow arrow-left"
    id="left"
    aria-label="Image précédente">
    ‹
  </button>

  <button
    class="arrow arrow-right"
    id="right"
    aria-label="Image suivante">
    ›
  </button>


  <!-- =========================
       PDF.JS
       ========================= -->

  <script type="module">

    import {
      getDocument,
      GlobalWorkerOptions,
      TextLayer,
      Util
    } from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";


    GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    /* =========================================
       CHARGEMENT D'UN PDF
       ========================================= */

    async function loadPDF(container) {

      const url =
        container.dataset.pdf;


      const pdf =
        await getDocument(url).promise;


      /*
        On utilise la première page
        de chaque PDF.
      */

      const page =
        await pdf.getPage(1);


      /*
        Taille originale du PDF
      */

      const baseViewport =
        page.getViewport({
          scale: 1
        });


      /*
        Taille disponible à l'écran
      */

      const availableWidth =
        window.innerWidth;

      const availableHeight =
        window.innerHeight;


      /*
        Calcul du zoom.
        Le PDF tient entièrement
        dans l'écran.
      */

      const scaleX =
        availableWidth /
        baseViewport.width;

      const scaleY =
        availableHeight /
        baseViewport.height;


      const scale =
        Math.min(
          scaleX,
          scaleY
        );


      /*
        IMPORTANT :
        exactement le même viewport
        est utilisé pour le canvas
        ET pour la TextLayer.
      */

      const viewport =
        page.getViewport({
          scale: scale
        });


      /*
        Conteneur de la page
      */

      const pageContainer =
        document.createElement("div");

      pageContainer.className =
        "pdf-page";


      pageContainer.style.width =
        Math.ceil(viewport.width) + "px";


      pageContainer.style.height =
        Math.ceil(viewport.height) + "px";


      /*
        =========================
        CANVAS
        =========================
      */

      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      const outputScale =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.ceil(
          viewport.width *
          outputScale
        );


      canvas.height =
        Math.ceil(
          viewport.height *
          outputScale
        );


      canvas.style.width =
        Math.ceil(viewport.width) + "px";


      canvas.style.height =
        Math.ceil(viewport.height) + "px";


      pageContainer.appendChild(
        canvas
      );


      /*
        =========================
        TEXT LAYER
        =========================
      */

      const textLayerDiv =
        document.createElement("div");


      textLayerDiv.className =
        "textLayer";


      pageContainer.appendChild(
        textLayerDiv
      );


      /*
        =========================
        ANNOTATION LAYER
        =========================
      */

      const annotationLayer =
        document.createElement("div");


      annotationLayer.className =
        "annotationLayer";


      pageContainer.appendChild(
        annotationLayer
      );


      /*
        Ajout de la page
        dans la slide.
      */

      container.appendChild(
        pageContainer
      );


      /*
        =========================
        RENDU CANVAS
        =========================
      */

      const renderContext = {

        canvasContext:
          context,

        viewport:
          viewport,

        transform:
          outputScale !== 1
            ? [
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
              ]
            : null

      };


      await page.render(
        renderContext
      ).promise;


      /*
        =========================
        RENDU TEXT LAYER
        =========================
      */

      const textContent =
        await page.getTextContent();


      const textLayer =
        new TextLayer({

          textContentSource:
            textContent,

          container:
            textLayerDiv,

          viewport:
            viewport

        });


      await textLayer.render();


      /*
        =========================
        LIENS PDF
        =========================
      */

      const annotations =
        await page.getAnnotations();


      annotations.forEach(
        annotation => {

          if (
            annotation.subtype !==
            "Link"
          ) {
            return;
          }


          /*
            Coordonnées du lien
          */

          const rect =
            Util.normalizeRect(
              annotation.rect
            );


          const viewportRect =
            viewport.convertToViewportRectangle(
              rect
            );


          const x1 =
            Math.min(
              viewportRect[0],
              viewportRect[2]
            );


          const y1 =
            Math.min(
              viewportRect[1],
              viewportRect[3]
            );


          const width =
            Math.abs(
              viewportRect[2] -
              viewportRect[0]
            );


          const height =
            Math.abs(
              viewportRect[3] -
              viewportRect[1]
            );


          const link =
            document.createElement("a");


          link.style.left =
            x1 + "px";


          link.style.top =
            y1 + "px";


          link.style.width =
            width + "px";


          link.style.height =
            height + "px";


          /*
            Lien externe
          */

          if (
            annotation.url
          ) {

            link.href =
              annotation.url;

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

          }


          /*
            Lien interne au PDF
          */

          else if (
            annotation.dest
          ) {

            link.href =
              "#";


            link.addEventListener(
              "click",
              async event => {

                event.preventDefault();


                try {

                  const destination =
                    await pdf.getDestination(
                      annotation.dest
                    );


                  if (
                    destination
                  ) {

                    const pageIndex =
                      await pdf.getPageIndex(
                        destination[0]
                      );


                    console.log(
                      "Lien interne vers la page :",
                      pageIndex + 1
                    );

                  }

                } catch (error) {

                  console.error(
                    "Erreur du lien PDF :",
                    error
                  );

                }

              }
            );

          }


          annotationLayer.appendChild(
            link
          );

        }
      );

    }


    /* =========================================
       CHARGEMENT DES 19 PDF
       ========================================= */

    const pdfContainers =
      document.querySelectorAll(
        ".pdf-container"
      );


    await Promise.all(

      [...pdfContainers].map(
        async container => {

          try {

            await loadPDF(
              container
            );

          } catch (error) {

            console.error(
              "Impossible de charger :",
              container.dataset.pdf,
              error
            );

          }

        }
      )

    );


    /* =========================================
       NAVIGATION
       ========================================= */

    const gallery =
      document.getElementById(
        "gallery"
      );


    const left =
      document.getElementById(
        "left"
      );


    const right =
      document.getElementById(
        "right"
      );


    const slides =
      document.querySelectorAll(
        ".slide"
      );


    const totalSlides =
      slides.length;


    /*
      Slide actuelle
    */

    function getCurrentSlide() {

      return Math.round(
        gallery.scrollLeft /
        gallery.clientWidth
      );

    }


    /*
      Mise à jour des flèches
    */

    function updateArrows() {

      const currentSlide =
        getCurrentSlide();


      left.classList.toggle(
        "hidden",
        currentSlide === 0
      );


      right.classList.toggle(
        "hidden",
        currentSlide ===
        totalSlides - 1
      );

    }


    /*
      Slide suivante
    */

    function nextSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide <
        totalSlides - 1
      ) {

        gallery.scrollTo({

          left:
            (currentSlide + 1) *
            gallery.clientWidth,

          behavior:
            "smooth"

        });

      }

    }


    /*
      Slide précédente
    */

    function previousSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide > 0
      ) {

        gallery.scrollTo({

          left:
            (currentSlide - 1) *
            gallery.clientWidth,

          behavior:
            "smooth"

        });

      }

    }


    /*
      =========================
      FLÈCHES
      =========================
    */

    right.addEventListener(
      "click",
      () => {

        nextSlide();

        right.blur();

      }
    );


    left.addEventListener(
      "click",
      () => {

        previousSlide();

        left.blur();

      }
    );


    /*
      =========================
      CLAVIER
      =========================

      Capture les flèches même
      lorsque du texte PDF est
      sélectionné.
    */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          nextSlide();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          previousSlide();

        }

      },
      true
    );


    /*
      =========================
      SCROLL
      =========================
    */

    gallery.addEventListener(
      "scroll",
      updateArrows
    );


    updateArrows();

  </script>

</body>
</html>
