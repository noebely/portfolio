<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
  }

  .gallery {
    display: flex;
    width: 100%;
    height: 100dvh;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }

  .gallery::-webkit-scrollbar {
    display: none;
  }

  .slide {
    position: relative;
    flex: 0 0 100vw;
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    scroll-snap-align: start;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* =========================
     LIEN SLIDE 5
     ========================= */

  .film-link {
    position: absolute;
    bottom: 29px;
    left: 74%;
    transform: translateX(-50%);

    color: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;

    text-decoration: underline;

    font-weight: 700;

    z-index: 5;
    white-space: nowrap;

    transition: opacity 0.2s ease;
  }

  .film-link:hover {
    opacity: 0.7;
  }

  /* =========================
     FLÈCHES
     ========================= */

  .arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;

    width: 90px;
    height: 130px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: none;

    color: rgba(255, 255, 255, 0.75);

    font-size: 70px;
    font-family: Arial, sans-serif;
    font-weight: 300;

    cursor: pointer;

    transition:
      opacity 0.2s ease,
      color 0.2s ease;
  }

  .arrow:hover {
    color: rgba(255, 255, 255, 1);
  }

  .arrow-left {
    left: 10px;
  }

  .arrow-right {
    right: 10px;
  }

  .arrow.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>

  </div>

  <!-- =========================
       FLÈCHES
       ========================= -->

<button
 class="arrow arrow-left"
 id="left"
 aria-label="Image précédente">
‹ </button>

<button
 class="arrow arrow-right"
 id="right"
 aria-label="Image suivante">
› </button>

<script>

  const gallery = document.getElementById("gallery");
  const left = document.getElementById("left");
  const right = document.getElementById("right");

  const slides = document.querySelectorAll(".slide");
  const totalSlides = slides.length;


  /* =========================
     POSITION ACTUELLE
     ========================= */

  function getCurrentSlide() {

    return Math.round(
      gallery.scrollLeft / gallery.clientWidth
    );

  }


  /* =========================
     AFFICHAGE DES FLÈCHES
     ========================= */

  function updateArrows() {

    const currentSlide = getCurrentSlide();

    /* Première image :
       pas de flèche gauche */

    left.classList.toggle(
      "hidden",
      currentSlide === 0
    );


    /* Dernière image :
       pas de flèche droite */

    right.classList.toggle(
      "hidden",
      currentSlide === totalSlides - 1
    );

  }


  /* =========================
     IMAGE SUIVANTE
     ========================= */

  function nextSlide() {

    const currentSlide = getCurrentSlide();

    if (currentSlide < totalSlides - 1) {

      gallery.scrollTo({
        left: (currentSlide + 1) * gallery.clientWidth,
        behavior: "smooth"
      });

    }

  }


  /* =========================
     IMAGE PRÉCÉDENTE
     ========================= */

  function previousSlide() {

    const currentSlide = getCurrentSlide();

    if (currentSlide > 0) {

      gallery.scrollTo({
        left: (currentSlide - 1) * gallery.clientWidth,
        behavior: "smooth"
      });

    }

  }


  /* =========================
     CLIC SUR LES FLÈCHES
     ========================= */

  right.addEventListener("click", () => {

    nextSlide();

    right.blur();

  });


  left.addEventListener("click", () => {

    previousSlide();

    left.blur();

  });


  /* =========================
     CLAVIER ← →
     ========================= */

  document.addEventListener("keydown", (event) => {

    if (event.key === "ArrowRight") {

      event.preventDefault();

      nextSlide();

    }

    if (event.key === "ArrowLeft") {

      event.preventDefault();

      previousSlide();

    }

  });


  /* =========================
     MISE À JOUR DES FLÈCHES
     ========================= */

  gallery.addEventListener(
    "scroll",
    updateArrows
  );


  /* =========================
     CHARGEMENT INITIAL
     ========================= */

  window.addEventListener(
    "load",
    updateArrows
  );

</script>
