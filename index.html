<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noé Bély — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* =========================
       GALERIE
       ========================= */

    .gallery {
      display: flex;

      width: 100%;
      height: 100dvh;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    /* =========================
       SLIDES
       ========================= */

    .slide {
      position: relative;

      flex: 0 0 100vw;
      width: 100vw;
      min-width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      scroll-snap-align: start;
    }

    /* =========================
       PDF
       ========================= */

    .pdf-container {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .pdf-page {
      position: relative;

      flex: 0 0 auto;

      overflow: hidden;

      display: block;
    }

    .pdf-page canvas {
      display: block;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;
    }

    /* =========================
       TEXTE PDF SÉLECTIONNABLE
       ========================= */

    .textLayer {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      line-height: 1;

      pointer-events: auto;
    }

    .textLayer span {
      position: absolute;

      color: transparent;

      white-space: pre;

      cursor: text;

      transform-origin: 0% 0%;
    }

    .textLayer span::selection {
      background: rgba(0, 100, 255, 0.3);
    }

    /* =========================
       LIENS PDF
       ========================= */

    .annotationLayer {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    .annotationLayer a {
      position: absolute;

      pointer-events: auto;

      display: block;

      cursor: pointer;

      text-decoration: none;
    }

    /* =========================
       FLÈCHES
       ========================= */

    .arrow {
      position: fixed;

      top: 50%;
      transform: translateY(-50%);

      z-index: 100;

      width: 90px;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;

      color: rgba(255, 255, 255, 0.75);

      font-size: 70px;
      font-family: Arial, sans-serif;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }

    .arrow:hover {
      color: rgba(255, 255, 255, 1);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .arrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>


<body>

  <!-- =========================
       GALERIE
       ========================= -->

  <div class="gallery" id="gallery">

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf1.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf2.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf3.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf4.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf5.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf6.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf7.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf8.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf9.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf10.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf11.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf12.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf13.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf14.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf15.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf16.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf17.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf18.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf19.pdf"></div>
    </div>

  </div>


  <!-- =========================
       FLÈCHES
       ========================= -->

  <button
    class="arrow arrow-left"
    id="left"
    aria-label="Image précédente">
    ‹
  </button>

  <button
    class="arrow arrow-right"
    id="right"
    aria-label="Image suivante">
    ›
  </button>


  <!-- =========================
       PDF.JS
       ========================= -->

  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    /* =========================================
       CHARGER UN PDF
       ========================================= */

    async function loadPDF(container) {

      const url = container.dataset.pdf;

      const pdf =
        await pdfjsLib.getDocument(url).promise;

      /*
        Une seule page par PDF.
      */

      const page =
        await pdf.getPage(1);


      /*
        Dimensions originales
      */

      const baseViewport =
        page.getViewport({
          scale: 1
        });


      /*
        Dimensions disponibles
      */

      const availableWidth =
        window.innerWidth;

      const availableHeight =
        window.innerHeight;


      /*
        Calcul du zoom pour que
        toute la page soit visible.
      */

      const scaleX =
        availableWidth /
        baseViewport.width;

      const scaleY =
        availableHeight /
        baseViewport.height;


      const scale =
        Math.min(
          scaleX,
          scaleY
        );


      const viewport =
        page.getViewport({
          scale: scale
        });


      /*
        Conteneur de la page
      */

      const pageContainer =
        document.createElement("div");

      pageContainer.className =
        "pdf-page";

      pageContainer.style.width =
        Math.floor(viewport.width) + "px";

      pageContainer.style.height =
        Math.floor(viewport.height) + "px";


      /*
        CANVAS
      */

      const canvas =
        document.createElement("canvas");

      const context =
        canvas.getContext("2d");


      /*
        On arrondit les dimensions
        pour éviter le petit trait
        blanc sur le côté.
      */

      const canvasWidth =
        Math.ceil(viewport.width);

      const canvasHeight =
        Math.ceil(viewport.height);


      canvas.width =
        canvasWidth;

      canvas.height =
        canvasHeight;


      canvas.style.width =
        canvasWidth + "px";

      canvas.style.height =
        canvasHeight + "px";


      pageContainer.appendChild(
        canvas
      );


      /*
        COUCHE TEXTE
      */

      const textLayer =
        document.createElement("div");

      textLayer.className =
        "textLayer";


      pageContainer.appendChild(
        textLayer
      );


      /*
        COUCHE LIENS / ANNOTATIONS
      */

      const annotationLayer =
        document.createElement("div");

      annotationLayer.className =
        "annotationLayer";


      pageContainer.appendChild(
        annotationLayer
      );


      /*
        Ajout dans la page
      */

      container.appendChild(
        pageContainer
      );


      /*
        RENDU DU PDF
      */

      await page.render({

        canvasContext: context,

        viewport: viewport

      }).promise;


      /*
        ==============================
        TEXTE
        ==============================
      */

      const textContent =
        await page.getTextContent();


      textContent.items.forEach(
        item => {

          const span =
            document.createElement("span");


          span.textContent =
            item.str;


          const tx =
            pdfjsLib.Util.transform(
              viewport.transform,
              item.transform
            );


          const angle =
            Math.atan2(
              tx[1],
              tx[0]
            );


          const fontHeight =
            Math.sqrt(
              tx[2] * tx[2] +
              tx[3] * tx[3]
            );


          span.style.left =
            tx[4] + "px";


          span.style.top =
            (tx[5] - fontHeight) + "px";


          span.style.fontSize =
            fontHeight + "px";


          span.style.fontFamily =
            "sans-serif";


          span.style.transform =
            `rotate(${angle}rad)`;


          textLayer.appendChild(
            span
          );

        }
      );


      /*
        ==============================
        LIENS DU PDF
        ==============================
      */

      const annotations =
        await page.getAnnotations();


      annotations.forEach(
        annotation => {

          /*
            On ne crée un lien que
            pour les annotations qui
            possèdent une destination.
          */

          if (
            annotation.subtype !==
            "Link"
          ) {
            return;
          }


          const rect =
            pdfjsLib.Util.normalizeRect(
              annotation.rect
            );


          const [x1, y1, x2, y2] =
            pdfjsLib.Util.normalizeRect(
              viewport.convertToViewportRectangle(
                rect
              )
            );


          const link =
            document.createElement("a");


          link.style.left =
            Math.min(x1, x2) + "px";


          link.style.top =
            Math.min(y1, y2) + "px";


          link.style.width =
            Math.abs(x2 - x1) + "px";


          link.style.height =
            Math.abs(y2 - y1) + "px";


          /*
            Lien externe
          */

          if (
            annotation.url
          ) {

            link.href =
              annotation.url;

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

          }


          /*
            Certains PDF utilisent
            une destination au lieu
            d'une URL directe.
          */

          else if (
            annotation.dest
          ) {

            link.href =
              "#";

            link.addEventListener(
              "click",
              async event => {

                event.preventDefault();

                try {

                  const destination =
                    await pdf.getDestination(
                      annotation.dest
                    );

                  if (
                    destination
                  ) {

                    const pageIndex =
                      await pdf.getPageIndex(
                        destination[0]
                      );

                    const targetPage =
                      pageIndex + 1;

                    /*
                      Si le PDF contient
                      plusieurs pages, on
                      pourrait ici gérer
                      la navigation interne.
                    */

                    console.log(
                      "Destination PDF :",
                      targetPage
                    );

                  }

                } catch (error) {

                  console.error(
                    "Erreur lien PDF :",
                    error
                  );

                }

              }
            );

          }


          annotationLayer.appendChild(
            link
          );

        }
      );

    }


    /* =========================================
       CHARGEMENT DES PDF
       ========================================= */

    const pdfContainers =
      document.querySelectorAll(
        ".pdf-container"
      );


    await Promise.all(

      [...pdfContainers].map(
        async container => {

          try {

            await loadPDF(
              container
            );

          } catch (error) {

            console.error(
              "Impossible de charger :",
              container.dataset.pdf,
              error
            );

          }

        }
      )

    );


    /* =========================================
       NAVIGATION
       ========================================= */

    const gallery =
      document.getElementById(
        "gallery"
      );


    const left =
      document.getElementById(
        "left"
      );


    const right =
      document.getElementById(
        "right"
      );


    const slides =
      document.querySelectorAll(
        ".slide"
      );


    const totalSlides =
      slides.length;


    /*
      Slide actuelle
    */

    function getCurrentSlide() {

      return Math.round(
        gallery.scrollLeft /
        gallery.clientWidth
      );

    }


    /*
      Flèches
    */

    function updateArrows() {

      const currentSlide =
        getCurrentSlide();


      left.classList.toggle(
        "hidden",
        currentSlide === 0
      );


      right.classList.toggle(
        "hidden",
        currentSlide ===
        totalSlides - 1
      );

    }


    /*
      Slide suivante
    */

    function nextSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide <
        totalSlides - 1
      ) {

        gallery.scrollTo({

          left:
            (currentSlide + 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    /*
      Slide précédente
    */

    function previousSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide > 0
      ) {

        gallery.scrollTo({

          left:
            (currentSlide - 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    /*
      CLIC FLÈCHES
    */

    right.addEventListener(
      "click",
      () => {

        nextSlide();

        right.blur();

      }
    );


    left.addEventListener(
      "click",
      () => {

        previousSlide();

        left.blur();

      }
    );


    /*
      CLAVIER
    */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          nextSlide();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          previousSlide();

        }

      },
      true
    );


    /*
      MISE À JOUR
    */

    gallery.addEventListener(
      "scroll",
      updateArrows
    );


    updateArrows();

  </script>

</body>
</html>
