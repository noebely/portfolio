  <title>Noé Bély — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    .gallery {
      display: flex;
      width: 100%;
      height: 100dvh;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    .slide {
      position: relative;

      flex: 0 0 100vw;
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      scroll-snap-align: start;
    }

    /* PDF */

    .pdf-container {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .pdf-page {
      position: relative;

      max-width: 100%;
      max-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pdf-page canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .textLayer {
      position: absolute;
      inset: 0;

      overflow: hidden;
      line-height: 1;

      pointer-events: auto;
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: rgba(0, 100, 255, 0.3);
    }

    /* Flèches */

    .arrow {
      position: fixed;

      top: 50%;
      transform: translateY(-50%);

      z-index: 10;

      width: 90px;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;

      color: rgba(255, 255, 255, 0.75);

      font-size: 70px;
      font-family: Arial, sans-serif;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }


    .arrow:hover {
      color: rgba(255, 255, 255, 1);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .arrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>

  <!-- PDF.js -->

  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    /*
     * Chargement des PDF
     */

    async function loadPDF(container) {

      const url = container.dataset.pdf;

      const pdf = await pdfjsLib.getDocument(url).promise;

      /*
       * On suppose une seule page par PDF.
       */

      const page = await pdf.getPage(1);

      const baseViewport = page.getViewport({
        scale: 1
      });


      /*
       * On calcule automatiquement le zoom
       * pour que la page entière rentre dans l'écran.
       */

      const availableWidth = window.innerWidth;
      const availableHeight = window.innerHeight;

      const scaleX = availableWidth / baseViewport.width;
      const scaleY = availableHeight / baseViewport.height;

      const scale = Math.min(scaleX, scaleY);


      const viewport = page.getViewport({
        scale: scale
      });


      /*
       * Conteneur de la page
       */

      const pageContainer = document.createElement("div");

      pageContainer.className = "pdf-page";

      pageContainer.style.width =
        viewport.width + "px";

      pageContainer.style.height =
        viewport.height + "px";


      /*
       * Canvas
       */

      const canvas = document.createElement("canvas");

      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";


      pageContainer.appendChild(canvas);


      /*
       * Couche de texte
       */

      const textLayer = document.createElement("div");

      textLayer.className = "textLayer";

      textLayer.style.width =
        viewport.width + "px";

      textLayer.style.height =
        viewport.height + "px";


      pageContainer.appendChild(textLayer);

      container.appendChild(pageContainer);


      /*
       * Rendu de la page
       */

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      /*
       * Texte sélectionnable
       */

      const textContent =
        await page.getTextContent();

      const textLayerDiv = textLayer;

      const textItems = textContent.items;

      textItems.forEach(item => {

        const span = document.createElement("span");

        span.textContent = item.str;

        const tx = pdfjsLib.Util.transform(
          viewport.transform,
          item.transform
        );

        const angle =
          Math.atan2(tx[1], tx[0]);

        const fontHeight =
          Math.sqrt(
            tx[2] * tx[2] +
            tx[3] * tx[3]
          );

        span.style.left =
          tx[4] + "px";

        span.style.top =
          (tx[5] - fontHeight) + "px";

        span.style.fontSize =
          fontHeight + "px";

        span.style.fontFamily =
          "sans-serif";

        span.style.transform =
          `rotate(${angle}rad)`;

        textLayerDiv.appendChild(span);

      });

    }


    /*
     * Charger tous les PDF
     */

    const pdfContainers =
      document.querySelectorAll(".pdf-container");

    for (const container of pdfContainers) {

      try {

        await loadPDF(container);

      } catch (error) {

        console.error(
          "Impossible de charger le PDF :",
          container.dataset.pdf,
          error
        );

      }

    }


    /*
     * Navigation
     */

    const gallery =
      document.getElementById("gallery");

    const left =
      document.getElementById("left");

    const right =
      document.getElementById("right");

    const slides =
      document.querySelectorAll(".slide");

    const totalSlides =
      slides.length;


    function getCurrentSlide() {

      return Math.round(
        gallery.scrollLeft /
        gallery.clientWidth
      );

    }


    function updateArrows() {

      const currentSlide =
        getCurrentSlide();

      left.classList.toggle(
        "hidden",
        currentSlide === 0
      );

      right.classList.toggle(
        "hidden",
        currentSlide === totalSlides - 1
      );

    }


    function nextSlide() {

      const currentSlide =
        getCurrentSlide();

      if (
        currentSlide <
        totalSlides - 1
      ) {

        gallery.scrollTo({

          left:
            (currentSlide + 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    function previousSlide() {

      const currentSlide =
        getCurrentSlide();

      if (currentSlide > 0) {

        gallery.scrollTo({

          left:
            (currentSlide - 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    /*
     * Flèches souris
     */

    right.addEventListener(
      "click",
      () => {

        nextSlide();

        right.blur();

      }
    );


    left.addEventListener(
      "click",
      () => {

        previousSlide();

        left.blur();

      }
    );


    /*
     * Navigation clavier
     *
     * Le listener est placé sur window/document
     * et fonctionne également lorsque le texte
     * d'un PDF est sélectionné.
     */

    window.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "ArrowRight"
        ) {

          event.preventDefault();

          nextSlide();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          event.preventDefault();

          previousSlide();

        }

      },
      true
    );


    /*
     * Mise à jour des flèches
     */

    gallery.addEventListener(
      "scroll",
      updateArrows
    );

    window.addEventListener(
      "load",
      updateArrows
    );

    updateArrows();

  </script>
