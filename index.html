<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noé Bély — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* GALERIE */

    .gallery {
      display: flex;
      width: 100%;
      height: 100dvh;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    /* SLIDE */

    .slide {
      position: relative;

      flex: 0 0 100vw;
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      scroll-snap-align: start;
    }

    /* PDF */

    .pdf-container {
      position: relative;

      width: 100vw;
      height: 100dvh;

      flex: 0 0 100vw;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .pdf-page {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .pdf-page canvas {
      display: block;
    }

    /* TEXTE PDF SÉLECTIONNABLE */

    .textLayer {
      position: absolute;

      left: 0;
      top: 0;

      overflow: hidden;

      line-height: 1;
      pointer-events: auto;
    }

    .textLayer span {
      position: absolute;

      color: transparent;

      white-space: pre;

      cursor: text;

      transform-origin: 0% 0%;
    }

    .textLayer span::selection {
      background: rgba(0, 100, 255, 0.3);
    }

    /* FLÈCHES */

    .arrow {
      position: fixed;

      top: 50%;
      transform: translateY(-50%);

      z-index: 100;

      width: 90px;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;

      color: rgba(255, 255, 255, 0.75);

      font-size: 70px;
      font-family: Arial, sans-serif;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }

    .arrow:hover {
      color: rgba(255, 255, 255, 1);
    }

    .arrow-left {
      left: 10px;
    }

    .arrow-right {
      right: 10px;
    }

    .arrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>


<body>

  <div class="gallery" id="gallery">

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf1.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf2.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf3.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf4.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf5.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf6.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf7.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf8.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf9.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf10.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf11.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf12.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf13.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf14.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf15.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf16.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf17.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf18.pdf"></div>
    </div>

    <div class="slide">
      <div class="pdf-container" data-pdf="images/pdf19.pdf"></div>
    </div>

  </div>


  <!-- FLÈCHES -->

  <button
    class="arrow arrow-left"
    id="left"
    aria-label="Image précédente">
    ‹
  </button>

  <button
    class="arrow arrow-right"
    id="right"
    aria-label="Image suivante">
    ›
  </button>


  <!-- PDF.JS -->

  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


    /*
      CHARGEMENT D'UN PDF
    */

    async function loadPDF(container) {

      const url = container.dataset.pdf;

      const pdf =
        await pdfjsLib.getDocument(url).promise;

      /*
        Pour l'instant :
        une page par PDF.
      */

      const page =
        await pdf.getPage(1);

      /*
        Taille originale du PDF
      */

      const baseViewport =
        page.getViewport({
          scale: 1
        });

      /*
        Taille disponible à l'écran
      */

      const availableWidth =
        window.innerWidth;

      const availableHeight =
        window.innerHeight;


      /*
        On calcule le facteur permettant
        de faire tenir entièrement le PDF
        dans l'écran.
      */

      const scaleX =
        availableWidth /
        baseViewport.width;

      const scaleY =
        availableHeight /
        baseViewport.height;

      const scale =
        Math.min(
          scaleX,
          scaleY
        );


      const viewport =
        page.getViewport({
          scale: scale
        });


      /*
        Conteneur de la page
      */

      const pageContainer =
        document.createElement("div");

      pageContainer.className =
        "pdf-page";

      pageContainer.style.width =
        viewport.width + "px";

      pageContainer.style.height =
        viewport.height + "px";


      /*
        CANVAS
      */

      const canvas =
        document.createElement("canvas");

      const context =
        canvas.getContext("2d");


      canvas.width =
        Math.ceil(viewport.width);

      canvas.height =
        Math.ceil(viewport.height);


      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";


      pageContainer.appendChild(canvas);


      /*
        TEXTE SÉLECTIONNABLE
      */

      const textLayer =
        document.createElement("div");

      textLayer.className =
        "textLayer";

      textLayer.style.width =
        viewport.width + "px";

      textLayer.style.height =
        viewport.height + "px";


      pageContainer.appendChild(
        textLayer
      );


      container.appendChild(
        pageContainer
      );


      /*
        RENDU DU PDF
      */

      await page.render({

        canvasContext: context,

        viewport: viewport

      }).promise;


      /*
        RÉCUPÉRATION DU TEXTE
      */

      const textContent =
        await page.getTextContent();


      /*
        Création des zones de texte
      */

      textContent.items.forEach(
        item => {

          const span =
            document.createElement("span");

          span.textContent =
            item.str;


          const tx =
            pdfjsLib.Util.transform(
              viewport.transform,
              item.transform
            );


          const angle =
            Math.atan2(
              tx[1],
              tx[0]
            );


          const fontHeight =
            Math.sqrt(
              tx[2] * tx[2] +
              tx[3] * tx[3]
            );


          span.style.left =
            tx[4] + "px";

          span.style.top =
            (tx[5] - fontHeight) + "px";


          span.style.fontSize =
            fontHeight + "px";


          span.style.fontFamily =
            "sans-serif";


          span.style.transform =
            `rotate(${angle}rad)`;


          textLayer.appendChild(
            span
          );

        }
      );

    }


    /*
      CHARGEMENT DES 19 PDF
    */

    const pdfContainers =
      document.querySelectorAll(
        ".pdf-container"
      );


    /*
      On charge les PDF en parallèle
      pour éviter de bloquer la galerie.
    */

    await Promise.all(

      [...pdfContainers].map(
        async container => {

          try {

            await loadPDF(
              container
            );

          } catch (error) {

            console.error(
              "Impossible de charger :",
              container.dataset.pdf,
              error
            );

          }

        }
      )

    );


    /*
      NAVIGATION
    */

    const gallery =
      document.getElementById(
        "gallery"
      );

    const left =
      document.getElementById(
        "left"
      );

    const right =
      document.getElementById(
        "right"
      );

    const slides =
      document.querySelectorAll(
        ".slide"
      );

    const totalSlides =
      slides.length;


    /*
      SLIDE ACTUEL
    */

    function getCurrentSlide() {

      return Math.round(
        gallery.scrollLeft /
        gallery.clientWidth
      );

    }


    /*
      AFFICHAGE DES FLÈCHES
    */

    function updateArrows() {

      const currentSlide =
        getCurrentSlide();


      left.classList.toggle(
        "hidden",
        currentSlide === 0
      );


      right.classList.toggle(
        "hidden",
        currentSlide ===
        totalSlides - 1
      );

    }


    /*
      SLIDE SUIVANTE
    */

    function nextSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide <
        totalSlides - 1
      ) {

        gallery.scrollTo({

          left:
            (currentSlide + 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    /*
      SLIDE PRÉCÉDENTE
    */

    function previousSlide() {

      const currentSlide =
        getCurrentSlide();


      if (
        currentSlide > 0
      ) {

        gallery.scrollTo({

          left:
            (currentSlide - 1) *
            gallery.clientWidth,

          behavior: "smooth"

        });

      }

    }


    /*
      CLIC SUR LES FLÈCHES
    */

    right.addEventListener(
      "click",
      () => {

        nextSlide();

        right.blur();

      }
    );


    left.addEventListener(
      "click",
      () => {

        previousSlide();

        left.blur();

      }
    );


    /*
      CLAVIER
      Le true permet de récupérer
      les touches même lorsque le
      texte PDF est sélectionné.
    */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          nextSlide();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          previousSlide();

        }

      },
      true
    );


    /*
      MISE À JOUR DES FLÈCHES
    */

    gallery.addEventListener(
      "scroll",
      updateArrows
    );


    updateArrows();

  </script>

</body>
</html>
